; Production configuration of the prod image (ODOO_RC), no secret: only the values that
; differ from Odoo's defaults. Every option can be overridden by the environment, which
; Odoo 20 reads before this file: ODOO_<OPTION> (ODOO_WORKERS, ODOO_ADMIN_PASSWD...) and
; PGHOST, PGPORT, PGUSER, PGPASSWORD, PGDATABASE for the database. See docs/ci.md.
[options]
addons_path = /opt/odoo/addons,/opt/odoo/vendor
data_dir = /var/lib/odoo
list_db = False

; Odoo 20 listens on 127.0.0.1 by default: a container must listen on all interfaces
http_interface = 0.0.0.0
proxy_mode = True

workers = 2
max_cron_threads = 1
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_time_cpu = 600
limit_time_real = 1200
