; Never use in production
[options]
; OCA addons installed by pip are found without being listed (odoo.addons namespace)
addons_path = /workspace/addons,/workspace/vendor
data_dir = /var/lib/odoo
admin_passwd = admin
; Odoo 20 doesn't liten 127.0.0.1 anymore : set 0.0.0.0 to expose ports
http_interface = 0.0.0.0

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
list_db = True
with_demo = True

; workers = 0 is required; otherwise, debugpy won't work
workers = 0
max_cron_threads = 1
limit_time_cpu = 3600
limit_time_real = 3600

; Local dev SMTP server with mailpit (http://localhost:8025)
smtp_server = mailpit
smtp_port = 1025

log_level = info
