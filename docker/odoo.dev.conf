; Configuration Odoo pour le développement (dev container).
; Ne jamais utiliser en production.
[options]
addons_path = /opt/odoo/addons,/workspace/addons
data_dir = /var/lib/odoo
admin_passwd = admin
; Odoo 20 écoute par défaut sur 127.0.0.1 : nécessaire pour publier le port hors du conteneur
http_interface = 0.0.0.0

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
list_db = True
with_demo = True

; workers = 0 : mode threadé, indispensable pour que les breakpoints fonctionnent
workers = 0
max_cron_threads = 1
limit_time_cpu = 3600
limit_time_real = 3600

; Les e-mails sortants sont capturés par Mailpit (http://localhost:8025)
smtp_server = mailpit
smtp_port = 1025

log_level = info
