# CI orchestrator: three groups of jobs (reusable workflows), see docs/ci.md.
#   Quality    quality.yml   pre-commit
#   Image      image.yml     base -> build -> tests + smoke -> publish
#   Promotion  promote.yml   tag vX.Y.Z: last release candidate -> X.Y.Z
# Jobs are thin wrappers around ci/*.sh, which run the same way locally.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop, "release/**", "hotfix/**", "*.0"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/quality.yml

  image:
    if: github.ref_type != 'tag'
    needs: quality
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  promote:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/promote.yml
    permissions:
      contents: read
      packages: write
