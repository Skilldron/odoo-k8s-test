# Contrôles qualité — exécutés au commit (local) et en CI (même configuration).
# Lancer manuellement : pre-commit run --all-files
exclude: |
  (?x)
  ^node_modules/|
  ^vendor/|
  /static/lib/|
  /static/description/index\.html$|
  \.svg$|
  ^deploy/chart/templates/
default_language_version:
  python: python3
  node: system

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      # check-executables-have-shebangs volontairement absent : sur Docker Desktop
      # (macOS), le montage « fakeowner » rend tous les fichiers exécutables.
      - id: check-symlinks
      - id: check-xml
      - id: check-yaml
        # Kubernetes manifests hold several documents
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.2.27
    hooks:
      - id: oca-checks-odoo-module
      - id: oca-checks-po

  - repo: https://github.com/OCA/pylint-odoo
    rev: v10.0.12
    hooks:
      - id: pylint_odoo
        args: ["--rcfile=.pylintrc"]
        # Odoo module rules: project addons only (not the ci/ and docker/ scripts)
        files: ^addons/

  - repo: local
    hooks:
      - id: prettier
        name: prettier (xml, js, scss, css, yaml, json, md)
        entry: prettier --write --ignore-unknown
        language: node
        types_or: [xml, javascript, scss, css, yaml, json, markdown]
        additional_dependencies:
          - "prettier@3.9.10"
          - "@prettier/plugin-xml@3.4.2"
      - id: eslint
        name: eslint
        entry: eslint --fix --no-warn-ignored
        language: node
        types: [javascript]
        additional_dependencies:
          - "eslint@10.12.0"
          - "@eslint/js@10.0.1"
          - "globals@17.13.0"
