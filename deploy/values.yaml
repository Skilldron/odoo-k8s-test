# Values of every environment, those of the image (docker/Dockerfile), loaded before
# deploy/values/<environment>.yaml. The chart's defaults are those of the official odoo
# image: keep these in step with the Dockerfile.

# Prefix of the review app hosts
project: odootest

# Private packages: docker-registry Secret ghcr in every namespace
image:
  pullSecrets: [ghcr]

# User odoo of the image: uid and gid 1000
podSecurityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}

odoo:
  config:
    options:
      # Project addons, then purchased modules (pip addons are found without a path)
      addons_path: [/opt/odoo/addons, /opt/odoo/vendor]
      # monitoring_opentelemetry is loaded in every process, not installed in the database
      server_wide_modules: [base, web, monitoring_opentelemetry]
  # OpenTelemetry: traces and logs to the EDOT gateway of the cluster (OTLP HTTP),
  # authenticated by the token of the Secret otlp (key token) of each namespace, optional:
  # without it Odoo runs and the gateway refuses the export. Each environment sets
  # deployment.environment.name
  env:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway.observability.svc:4318
    OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer%20$(OTLP_TOKEN)
    OTEL_SERVICE_NAME: odootest

secrets:
  env:
    - {name: OTLP_TOKEN, secret: otlp, key: token, optional: true}
