# The application Secret (secrets.existingSecret) produced by External Secrets Operator
# from an external secret manager (Vault, a cloud provider's manager, Infisical...). The
# SecretStore "odoo" is configured by the administrator for that manager.
#   kubectl -n <namespace> apply -f examples/external-secret.example.yaml
# Odoo reads the keys as environment variables: restart it after a rotation
# (kubectl rollout restart deployment/<release>).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: odoo-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: odoo
  target:
    name: odoo-app
  data:
    - secretKey: admin-passwd
      remoteRef: {key: odoo/production, property: admin-passwd}
    - secretKey: admin-user-password
      remoteRef: {key: odoo/production, property: admin-user-password}
    - secretKey: smtp-password
      remoteRef: {key: odoo/production, property: smtp-password}
