# Stable Service of the database: Odoo connects to odoo-db (database.external.host),
# whatever the active CNPG cluster. Applied once by the administrator, outside any Helm
# release: uninstalling an old cluster must not take it away.
#   kubectl -n <namespace> apply -f examples/database-service.yaml
# A restoration (docs/operations.md) switches it to the restored cluster:
#   kubectl -n <namespace> patch service odoo-db \
#     -p '{"spec":{"selector":{"cnpg.io/cluster":"odoo-db-r<N>"}}}'
apiVersion: v1
kind: Service
metadata:
  name: odoo-db
spec:
  selector:
    cnpg.io/cluster: odoo-db
    cnpg.io/instanceRole: primary
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
