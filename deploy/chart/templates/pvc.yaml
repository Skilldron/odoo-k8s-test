{{- /*
Filestore and sessions (/var/lib/odoo), §3.4. Review: named after the digest, a new image
gets a new volume and Helm deletes the old one. Recette/prod: kept by Helm; a manual
restoration of the filestore uses odoo.persistence.existingClaim instead.
*/ -}}
{{- $p := .Values.odoo.persistence }}
{{- if and $p.enabled (not $p.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "odoo.dataClaim" . }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
    app.kubernetes.io/component: odoo
  {{- if not (include "odoo.review" .) }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes: [{{ $p.accessMode }}]
  {{- with $p.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
{{- end }}
