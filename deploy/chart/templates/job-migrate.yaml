{{- /*
Job migrate (§6.2): native commands in successive containers, no script. Named after the
digest: a Job is immutable, and redeploying the same digest runs nothing again.
*/ -}}
{{- if .Values.jobs.migrate.run }}
{{- $modules := .Values.odoo.modules | default (list "base") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ include "odoo.shortDigest" . }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.jobs.migrate.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.jobs.migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "odoo.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- include "odoo.podCommon" . | nindent 6 }}
      restartPolicy: Never
      initContainers:
        {{- if eq .Values.database.type "ephemeral" }}
        - name: db-init
          image: {{ include "odoo.image" . }}
          args: [odoo, db, init, --with-demo, --password, $(ODOO_REVIEW_ADMIN_PASSWORD), $(PGDATABASE)]
          env:
            {{- include "odoo.env" . | nindent 12 }}
            - name: ODOO_REVIEW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "odoo.generatedSecret" . }}, key: review-admin-password}
          resources:
            {{- toYaml .Values.odoo.resources | nindent 12 }}
          securityContext:
            {{- include "odoo.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "odoo.volumeMounts" . | nindent 12 }}
        {{- end }}
        - name: install
          image: {{ include "odoo.image" . }}
          args: [odoo, -i, {{ join "," $modules }}, --stop-after-init, --no-http]
          env:
            {{- include "odoo.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.odoo.resources | nindent 12 }}
          securityContext:
            {{- include "odoo.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "odoo.volumeMounts" . | nindent 12 }}
      containers:
        - name: update
          image: {{ include "odoo.image" . }}
          args: [click-odoo-update]
          env:
            {{- include "odoo.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.odoo.resources | nindent 12 }}
          securityContext:
            {{- include "odoo.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "odoo.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "odoo.volumes" . | nindent 8 }}
{{- end }}
