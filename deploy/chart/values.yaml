# Defaults shared by every environment. deploy/values/<env>.yaml overrides them; the CI
# only adds image.digest, the step settings (odoo.replicas, jobs.*.run) and the state of
# the environment (state). See docs/plans/k8s-deployment.md §6.

# review | recette | production (required)
environment: ""

# Project name: prefix of the review hosts (<project>-<release>.<route.reviewDomain>)
project: odoo

image:
  repository: ghcr.io/owner/repo/builds
  # sha256:<64 hex>, set by the CI. The image is always referenced by digest.
  digest: ""
  # Names of existing docker-registry Secrets (GHCR)
  pullSecrets: []

odoo:
  # 0 or 1, set by ci/deploy.sh at each step
  replicas: 0
  # Modules installed by the migrate Job (odoo -i). ci/chart-lint.sh checks that the list
  # matches the folders of addons/.
  modules: [dev_sample]
  # odoo.conf, section by section. The chart imposes addons_path, data_dir and
  # http_interface (and the SMTP of Mailpit when it is enabled). No secret here: the
  # schema refuses option names containing passw, secret or token.
  config:
    options:
      proxy_mode: true
      list_db: false
      workers: 2
      max_cron_threads: 1
      limit_memory_soft: 2147483648
      limit_memory_hard: 2684354560
      limit_time_cpu: 600
      limit_time_real: 1200
  persistence:
    storageClass: ""
    size: 5Gi
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 3Gi}

jobs:
  migrate:
    # Rendered only when true (ci/deploy.sh, step 4)
    run: false
    activeDeadlineSeconds: 1800
    ttlSecondsAfterFinished: 604800
  # Recette, production: odoo db init creates Odoo's database with the admin password of
  # the application Secret, and refuses an existing one. Run by ci/deploy.sh until
  # state.initialized (review: first step of the migrate Job, with the demo data).
  dbInit:
    run: false
    activeDeadlineSeconds: 600

secrets:
  # Application Secret (keys admin-passwd, admin-user-password for the first deployment,
  # optional smtp-password). Required outside review; in review the chart generates its
  # own Secret.
  existingSecret: ""
  # Secrets of the modules, as environment variables: [{name, secret, key}]
  env: []

database:
  # ephemeral (review only, created by this chart) | external (recette, production: a
  # database installed apart, e.g. with the CloudNativePG "cluster" chart)
  type: external
  # Name of Odoo's database, created by odoo db init (migrate Job)
  name: odoo
  ephemeral:
    image: postgres:18
    storageClass: ""
    size: 2Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
  external:
    # Secret with the keys host, port, username, password: the <cluster>-app Secret of
    # CNPG, or a Secret created with the same keys for another database. Its role needs
    # CREATEDB: Odoo creates its database (database.name) at the first deployment.
    secret: ""
    # Name of the CNPG Cluster, when the database is one: ci/deploy.sh then takes a
    # database restore point before each update. Not used by the templates.
    cnpgCluster: ""

snapshots:
  # VolumeSnapshotClass of the filestore restore points (used by ci/deploy.sh)
  volumeSnapshotClass: ""

# State of a recette or production environment, written by ci/deploy.sh and
# ci/deploy-rollback.sh, read back from the release and carried over by every deployment.
# Never set in deploy/values/<env>.yaml.
state:
  # Odoo's database exists (odoo db init done)
  initialized: false
  # Suffix of the filestore volume, increased by a restoration (§3.3)
  generation: 1
  # VolumeSnapshot the current filestore volume was created from
  filestore: ""
  # Database restored by the runbook: its Secret and CNPG Cluster replace database.external
  databaseSecret: ""
  cnpgCluster: ""

mailpit:
  enabled: false
  image: axllent/mailpit:v1.31.4
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

route:
  # Gateway API parentRefs of the administrator's Gateway; no HTTPRoute when empty
  parentRefs: []
  # Odoo host (recette, production)
  host: ""
  # Mailpit host (recette)
  mailpitHost: ""
  # Review hosts: <project>-<release>.<reviewDomain> and <project>-<release>-mail.<reviewDomain>
  reviewDomain: ""

networkPolicy:
  enabled: true
  # NetworkPolicyPeers allowed to reach Odoo and Mailpit (the Gateway). Empty: any source.
  # An external database is protected by its own policy (deploy/examples).
  ingressFrom: []
