# Database of a recette or production environment, installed by the administrator with the
# CloudNativePG "cluster" chart, not by the CI:
#
#   helm install odoo-db cluster --repo https://cloudnative-pg.github.io/charts \
#     --version 0.9.0 -n <project>-prod -f deploy/examples/cnpg-cluster.values.yaml
#
# Creates the Cluster "odoo-db". Odoo reaches it through the stable Service odoo-db
# (database-service.yaml, applied once) with the declared role odoo, whose password is in
# the Secret odoo-db-credentials (database-credentials.example.sh, created first): the same
# role and password on every cluster restored from these values. The Secret odoo-db-app
# generated by CNPG is not used. The role odoo gets CREATEDB: Odoo creates its own database
# at the first deployment (odoo db init, with the admin password of the application
# Secret); "app" stays empty.
# Requires the CNPG operator, the Barman Cloud plugin, a Secret "odoo-db-s3" with the keys
# ACCESS_KEY_ID and ACCESS_SECRET_KEY, and a storage class with volume snapshots (Longhorn:
# longhorn-volumesnapshotclass.yaml, deletionPolicy: Delete).
#
# Then, after every install of the database (ci/deploy-restore.sh does it for a cluster it
# restores), enable the cold volume snapshots of the restore points, owned by their Backup
# (deleting a restore point deletes its snapshots). The chart cannot set this section
# (https://github.com/cloudnative-pg/charts/issues/900); helm upgrade keeps it. Without it
# the CI refuses to deploy, before stopping Odoo.
#
#   kubectl -n <project>-prod patch cluster odoo-db --type merge -p \
#     '{"spec":{"backup":{"volumeSnapshot":{"className":"csi-snapclass","online":false,"snapshotOwnerReference":"backup"}}}}'
fullnameOverride: odoo-db
type: postgresql
version:
  postgresql: "18"
mode: standalone

cluster:
  instances: 1
  storage:
    size: 20Gi
    # Must support volume snapshots (restore points); "" = the default class
    storageClass: ""
  enableSuperuserAccess: false
  # A single instance: a PodDisruptionBudget would block node drains
  enablePDB: false
  initdb:
    database: app
    owner: odoo
    secret:
      name: odoo-db-credentials
    # Run in the database postgres: the stop-snapshot Job names a restore point in the WAL
    # before each update (a superuser function otherwise)
    postInitSQL:
      - GRANT EXECUTE ON FUNCTION pg_create_restore_point(text) TO odoo
  # Applied by CNPG whatever the bootstrap, a recovery included
  roles:
    - name: odoo
      ensure: present
      login: true
      createdb: true
      superuser: false
      passwordSecret:
        name: odoo-db-credentials
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true

backups:
  enabled: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  provider: s3
  # S3-compatible endpoint; empty for AWS (then s3.region is required)
  endpointURL: ""
  # One folder per environment: Barman refuses to archive into a non-empty folder
  destinationPath: s3://odoo-backups/project-prod/
  s3:
    region: eu-west-3
  # The chart asks for server-side encryption AES256 (wal.encryption, data.encryption):
  # set both to "" for a store without it (MinIO without KMS refuses every upload)
  secret:
    create: false
    name: odoo-db-s3
  scheduledBackups:
    - name: nightly
      schedule: "0 0 2 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
  retentionPolicy: 30d
