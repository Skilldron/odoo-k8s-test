# Restoration of the database from a restore point, by hand. The restore job of the
# workflow (ci/deploy-restore.sh) does the same with the values of the active cluster.
# A new cluster, odoo-db-r<N>, is created from the volume snapshot of the restore point
# <cluster>-preupgrade-r<N>; the previous cluster stays in place for analysis.
#
#   helm install odoo-db-r<N> cluster --repo https://cloudnative-pg.github.io/charts \
#     --version 0.9.0 -n <project>-prod \
#     -f deploy/examples/cnpg-cluster.values.yaml \
#     -f deploy/examples/cnpg-cluster-recovery.values.yaml \
#     --set fullnameOverride=odoo-db-r<N> --set recovery.backupName=<restore point>
#
# Then the volumeSnapshot patch (see cnpg-cluster.values.yaml) on odoo-db-r<N>, the stable
# Service switched to it (database-service.yaml), and the restore point labelled restored.
# The declared role odoo keeps its password (Secret odoo-db-credentials).
mode: recovery
cluster:
  instances: 1
recovery:
  # The CNPG Backup of the restore point (method volumeSnapshot, same namespace)
  method: backup
  backupName: ""
  # Same as the restored cluster; Odoo's database comes with the snapshot
  database: app
  owner: odoo
