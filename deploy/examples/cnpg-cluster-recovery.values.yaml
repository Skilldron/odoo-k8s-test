# Runbook "restore the database" after a failed update: a new cluster, odoo-db-2, created
# from the volume snapshot of the restore point (its name is given by the CI summary). The
# failed cluster stays in place for analysis, and so do its snapshots.
#
#   helm install odoo-db-2 cluster --repo https://cloudnative-pg.github.io/charts \
#     --version 0.9.0 -n <project>-prod \
#     -f deploy/examples/cnpg-cluster.values.yaml \
#     -f deploy/examples/cnpg-cluster-recovery.values.yaml \
#     --set fullnameOverride=odoo-db-2 --set recovery.backupName=<restore point>
#
# Then, as after every install of the database, the volumeSnapshot patch (see
# cnpg-cluster.values.yaml) on odoo-db-2, or the next deployment is refused. Finally the
# rollback workflow points Odoo to the Secret odoo-db-2-app.
mode: recovery
recovery:
  # The CNPG Backup of the restore point (method volumeSnapshot, same namespace)
  method: backup
  backupName: ""
  database: odoo
  owner: odoo
