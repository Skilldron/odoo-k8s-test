# Production: release odoo in <project>-prod, deployed from the v* tags.
# CNPG database installed apart with the CloudNativePG cluster chart, restore point before
# each update, real SMTP (password in the application Secret, key smtp-password).
environment: production

odoo:
  # Modules of addons/ (checked by ci/chart-lint.sh)
  modules: [dev_sample]
  config:
    options:
      workers: 4
      max_cron_threads: 2
      smtp_server: smtp.example.com
      smtp_port: 587
      smtp_ssl: true
      smtp_user: odoo@example.com
      email_from: odoo@example.com
  persistence:
    size: 20Gi
  resources:
    requests: {cpu: 500m, memory: 2Gi}
    limits: {memory: 4Gi}

secrets:
  existingSecret: odoo-app

database:
  external:
    # Stable Service odoo-db (deploy/chart/examples/database-service.yaml) and the Secret of
    # the declared role odoo (deploy/chart/examples/database-credentials.example.sh)
    host: odoo-db
    port: 5432
    secret: odoo-db-credentials

restorePoints:
  # deletionPolicy: Delete (deploy/chart/examples/longhorn-volumesnapshotclass.yaml)
  volumeSnapshotClass: csi-snapclass

route:
  parentRefs:
    - {name: gateway, namespace: gateway-system}
  host: odoo.example.com

networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway-system
