# Production: release odoo in <project>-prod, deployed from the v* tags.
# CNPG database installed apart with the CloudNativePG cluster chart, restore point before
# each update, real SMTP (password in the application Secret, key smtp-password).
environment: production

odoo:
  # Modules of addons/ (checked by ci/values-lint.sh)
  modules: [dev_sample]
  config:
    options:
      # Sized for a small instance: raise workers with the traffic (about 6 users per
      # worker, at most CPU x 2 + 1), and limits.memory with them. Each process
      # (workers, cron, websocket) is recycled above limit_memory_soft and killed above
      # limit_memory_hard: their sum stays under limits.memory.
      workers: 2
      max_cron_threads: 1
      limit_memory_soft: 402653184
      limit_memory_hard: 503316480
      smtp_server: smtp.example.com
      smtp_port: 587
      smtp_ssl: true
      smtp_user: odoo@example.com
      email_from: odoo@example.com
  persistence:
    size: 20Gi
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 2Gi}

secrets:
  existingSecret: odoo-app

database:
  external:
    # Stable Service odoo-db and the Secret of the declared role odoo (chart README,
    # Database of a persistent instance)
    host: odoo-db
    port: 5432
    secret: odoo-db-credentials

restorePoints:
  # deletionPolicy: Delete
  volumeSnapshotClass: csi-snapclass

route:
  parentRefs:
    - {name: gateway, namespace: gateway-system}
  host: odoo.example.com

networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway-system
