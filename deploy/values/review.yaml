# Review apps: one release pr-<n> per pull request, in the shared namespace <project>-review.
# Demo database recreated on every new image, Mailpit, threaded Odoo.
environment: review
ephemeral: true

odoo:
  # Modules of addons/ (checked by ci/values-lint.sh)
  modules: [dev_sample]
  config:
    options:
      workers: 0
      max_cron_threads: 1
  persistence:
    size: 1Gi
  # Little traffic: one threaded process
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}

mailpit:
  enabled: true

route:
  parentRefs:
    - {name: gateway, namespace: gateway-system}
  reviewDomain: odoo.k3s.haroldd.dev

networkPolicy:
  # Traefik, the Gateway of the cluster, runs in kube-system
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
