# Recette: release odoo in <project>-recette, deployed from release/* and hotfix/*.
# CNPG database installed apart with the CloudNativePG cluster chart, restore point
# before each update, Mailpit.
environment: recette

odoo:
  config:
    options:
      workers: 2
      max_cron_threads: 1
  persistence:
    size: 5Gi

secrets:
  existingSecret: odoo-app

database:
  type: external
  external:
    # Stable Service odoo-db (deploy/examples/database-service.yaml) and the Secret of
    # the declared role odoo (deploy/examples/database-credentials.example.sh)
    host: odoo-db
    port: 5432
    secret: odoo-db-credentials

restorePoints:
  # deletionPolicy: Delete (deploy/examples/longhorn-volumesnapshotclass.yaml)
  volumeSnapshotClass: csi-snapclass

mailpit:
  enabled: true

route:
  parentRefs:
    - {name: gateway, namespace: gateway-system}
  host: recette.example.com
  mailpitHost: mail.recette.example.com

networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway-system
