# Recette: release odoo in <project>-recette, deployed from release/* and hotfix/*.
# Database installed apart (CNPG cluster chart or another PostgreSQL), restore point
# before each update when it is a CNPG cluster, Mailpit.
environment: recette

odoo:
  config:
    options:
      workers: 2
      max_cron_threads: 1
  persistence:
    size: 5Gi

secrets:
  existingSecret: odoo-app

database:
  type: external
  external:
    secret: odoo-db-app
    cnpgCluster: odoo-db

snapshots:
  volumeSnapshotClass: csi-snapclass

mailpit:
  enabled: true

route:
  parentRefs:
    - {name: gateway, namespace: gateway-system}
  host: recette.example.com
  mailpitHost: mail.recette.example.com

networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway-system
