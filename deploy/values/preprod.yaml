# Preprod: release odoo in <project>-preprod, mirror of the production: the release
# candidates of hotfix/*, then the production image after each tag. Neutralized copy of
# the production database; CNPG database installed apart with the CloudNativePG cluster
# chart, restore point before each update, Mailpit.
environment: preprod

odoo:
  # Modules of addons/ (checked by ci/values-lint.sh)
  modules: [dev_sample]
  config:
    options:
      # Same process model as the production, sized for little traffic. Each process
      # (workers, cron, websocket) is recycled above limit_memory_soft and killed above
      # limit_memory_hard: their sum stays under limits.memory.
      workers: 2
      max_cron_threads: 1
      limit_memory_soft: 402653184
      limit_memory_hard: 503316480
  persistence:
    size: 5Gi
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 2Gi}

secrets:
  existingSecret: odoo-app

database:
  external:
    # Stable Service odoo-db and the Secret of the declared role odoo (chart README,
    # Database of a persistent instance)
    host: odoo-db
    port: 5432
    secret: odoo-db-credentials

restorePoints:
  # deletionPolicy: Delete
  volumeSnapshotClass: csi-snapclass

mailpit:
  enabled: true

route:
  parentRefs:
    - {name: gateway, namespace: gateway-system}
  host: preprod.example.com
  mailpitHost: mail.preprod.example.com

networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway-system
