# Staging: release odoo in <project>-staging, deployed from the release candidates of
# release/*. Neutralized copy of the production database, refreshed on demand; CNPG
# database installed apart with the CloudNativePG cluster chart, restore point before
# each update, Mailpit.
environment: staging

odoo:
  # Modules of addons/ (checked by ci/values-lint.sh)
  modules: [dev_sample]
  config:
    options:
      # Little traffic (user acceptance): one threaded process
      workers: 0
      max_cron_threads: 1
  env:
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=staging,service.version=$(ODOO_IMAGE_TAG)
  persistence:
    # Longhorn: the default class local-path has no snapshots
    storageClass: longhorn
    size: 5Gi
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}

secrets:
  existingSecret: odoo-app

database:
  external:
    # Stable Service odoo-db and the Secret of the declared role odoo (chart README,
    # Database of a persistent instance)
    host: odoo-db
    port: 5432
    secret: odoo-db-credentials

restorePoints:
  # deletionPolicy: Delete
  volumeSnapshotClass: longhorn-snap

mailpit:
  enabled: true

route:
  parentRefs:
    - {name: gateway, namespace: gateway-system}
  host: staging.odoo.k3s.haroldd.dev
  mailpitHost: staging-mail.odoo.k3s.haroldd.dev

networkPolicy:
  # Traefik, the Gateway of the cluster, runs in kube-system
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
